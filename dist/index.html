<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fafb"><meta name="description" content="在世界地圖與台灣 22 縣市留下記事，自由上色，收藏每一個地方的故事。"><title>地圖記事 · Atlas Notes</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23176370'/%3E%3Ccircle cx='20' cy='20' r='12' stroke='white' fill='none' stroke-width='2'/%3E%3Cellipse cx='20' cy='20' rx='5' ry='12' stroke='white' fill='none'/%3E%3Cpath d='M8 20h24' stroke='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="./styles.css"><script src="./vendor/d3.min.js" defer></script><script src="./app.js" type="module"></script></head>
<body>
<header class="topbar"><button id="documents-button" class="brand" aria-label="切換地圖"><span class="brand-icon" aria-hidden="true">◎</span><span id="document-title" class="brand-title">我的地圖</span><span class="document-chevron" aria-hidden="true">⌄</span></button><nav class="view-switch" aria-label="地圖範圍"><button id="world-tab" class="active" aria-pressed="true">世界</button><button id="taiwan-tab" aria-pressed="false">台灣</button></nav><div class="header-actions"><button id="search-toggle" class="icon-button" aria-label="搜尋地區" aria-expanded="false" aria-controls="search-box" title="搜尋地區"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button id="tools-toggle" class="tools-toggle" aria-expanded="false" aria-controls="panel">工具</button><details id="more-menu" class="more-menu"><summary aria-label="更多功能" title="更多功能">⋯</summary><div class="more-actions"><button id="account-button">登入</button><button id="people-button">管理業務</button><button id="backup-button">備份資料</button><button id="share-button">分享網站</button></div></details></div></header>
<main class="workspace">
 <section class="map-area" aria-label="地圖工作區">
 <div id="search-box" class="search-box" hidden><input id="search" type="search" placeholder="搜尋國家或地區…" aria-label="搜尋國家或地區" autocomplete="off"><button id="close-search" aria-label="關閉搜尋">×</button><div id="search-results" class="search-results" hidden></div></div>
 <div id="map" class="map-canvas"></div><div id="loading" class="loading">正在展開地圖…</div>
 <button id="enter-taiwan" class="enter-taiwan" hidden>查看 22 縣市</button><div id="selection-label" class="selection-label" role="status" hidden></div>
 <div class="map-controls" aria-label="地圖控制"><button id="zoom-in" aria-label="放大地圖">＋</button><button id="zoom-out" aria-label="縮小地圖">−</button><span></span><button id="reset-map" aria-label="重設地圖視角">⌖</button></div>
 </section>
 <aside id="panel" class="panel" aria-label="地區與記事" hidden><div class="panel-head"><span>工具</span><button id="close-panel" class="icon-button" aria-label="關閉工具">×</button></div>
 <div id="empty-panel"><div class="list-header"><h3 id="list-title">選擇地區</h3><span id="region-total" class="count-badge"></span></div><div id="region-list" class="region-list"></div></div>
 <div id="region-panel" hidden><button id="back-list" class="back-list">‹ 所有地區</button><div class="region-heading"><div><span id="region-scope" class="section-kicker"></span><h2 id="region-name"></h2><p id="region-english"></p></div><button id="focus-region" class="icon-button" aria-label="定位選取地區">⌖</button></div><button id="explore-taiwan" class="taiwan-link" hidden>探索台灣 22 縣市</button>
 <section class="assignee-section"><div class="section-title"><h3>負責業務 <span id="assignee-count" class="count-badge">0 / 4</span></h3><button id="manage-people" class="text-button">管理</button></div><div id="assignees"></div></section><section class="color-section"><div class="section-title"><h3>地圖顏色</h3><button id="clear-color" class="text-button">清除</button></div><p class="color-hint">改用單色會取消此地區的業務標示</p><div id="swatches" class="swatches"></div><label class="custom-color"><input id="custom-color" type="color" value="#176370"><span>自訂單色</span><span id="color-value">尚未上色</span></label></section>
 <section class="events-section"><div class="section-title"><h3>地方記事 <span id="event-count" class="count-badge">0</span></h3><button id="add-event" class="small-primary">＋ 新增</button></div><div id="events"></div></section></div>
 <footer class="panel-footer"><p id="sync-state">僅此裝置</p><a href="./credits.html" target="_blank" rel="noopener" aria-label="圖資與授權">圖資</a></footer></aside>
</main>
<div id="toast" class="toast" role="status" hidden></div><div id="storage-warning" class="storage-warning" role="alert" hidden></div>
<dialog id="event-dialog"><form id="event-form"><div class="dialog-heading"><div><span id="event-region" class="section-kicker"></span><h2 id="event-dialog-title">新增記事</h2></div><button type="button" class="dialog-close" data-close="event-dialog" aria-label="關閉">×</button></div><label>日期<input id="event-date" type="date" required></label><label>標題<input id="event-title" type="text" maxlength="160" required placeholder="為這段故事取個名字"></label><label>內容 <span class="optional">選填</span><textarea id="event-content" maxlength="10000" rows="5" placeholder="發生了什麼？留下你的紀錄…"></textarea></label><p id="form-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet" data-close="event-dialog">取消</button><button class="primary" type="submit">儲存記事</button></div></form></dialog>
<dialog id="backup-dialog"><div class="dialog-heading"><h2>備份與還原</h2><button class="dialog-close" data-close="backup-dialog" aria-label="關閉">×</button></div><p>換裝置或清除瀏覽器資料前，請先匯出備份。</p><button id="export-data" class="backup-action"><strong>匯出備份</strong><span>下載目前地圖，完整保留顏色與記事</span></button><button id="import-data" class="backup-action"><strong>匯入備份</strong><span>新增為另一份地圖，JSON 上限 10 MB</span></button><button id="export-kml" class="backup-action"><strong>匯出 KML</strong><span>匯入 Google My Maps；多人斜線改用第一人的顏色，保留全部姓名與記事</span></button><div id="kml-downloads"></div><input id="import-file" type="file" accept=".json,application/json" hidden><p id="backup-error" class="form-error" role="alert"></p></dialog>
<dialog id="people-dialog"><div class="dialog-heading"><h2>管理業務</h2><button class="dialog-close" data-close="people-dialog" aria-label="關閉業務管理">×</button></div><div id="people-list"></div><form id="person-form"><label>業務姓名<input id="person-name" maxlength="40" required autocomplete="off"></label><label>代表顏色<input id="person-color" type="color" value="#db5353"></label><p id="people-error" class="form-error" role="alert"></p><div class="dialog-actions"><button id="person-cancel" type="button" class="quiet" hidden>取消編輯</button><button id="person-save" class="primary" type="submit">新增</button></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="dialog-actions"><button id="confirm-no" class="quiet">取消</button><button id="confirm-yes" class="primary">確認</button></div></dialog>
<dialog id="documents-dialog"><div class="dialog-heading"><h2>我的地圖</h2><button class="dialog-close" data-close="documents-dialog" aria-label="關閉地圖清單">×</button></div><div id="documents-list"></div><div class="document-create"><label for="new-document-name">新地圖名稱</label><input id="new-document-name" maxlength="80" placeholder="例如：公司業務、旅行"><button id="new-document" class="primary">新增地圖</button></div><div class="document-edit"><label for="document-name">目前地圖名稱</label><input id="document-name" maxlength="80"><div class="document-actions"><button id="rename-document" class="quiet">重新命名</button><button id="duplicate-document" class="quiet">建立副本</button><button id="delete-document" class="quiet">刪除地圖</button></div></div><button id="copy-local" class="backup-action" hidden>將此裝置地圖複製到雲端</button><p id="documents-error" class="form-error" role="alert"></p></dialog>
<dialog id="account-dialog"><div class="dialog-heading"><h2>Google 帳號</h2><button class="dialog-close" data-close="account-dialog" aria-label="關閉帳號">×</button></div><p id="account-email"></p><div id="google-button"></div><button id="sign-out" class="quiet" hidden>登出</button><p id="account-error" class="form-error" role="alert"></p></dialog>
<div id="sync-error" class="sync-error" role="alert" hidden><span id="sync-error-message"></span><div><button id="retry-sync">重試儲存</button><button id="download-unsaved">下載備份</button><button id="reload-cloud">載入雲端版本</button></div></div>
</body></html>
